version: 2

# One weekly pass per ecosystem, grouped, so a week of updates is a handful of
# pull requests and not forty. Security advisories open their own pull request
# immediately and ignore the schedule and the grouping.
#
# Three pnpm projects, each with its own lockfile and none sharing a workspace
# (AGENTS.md), so each one is declared separately. Dependabot reads
# `pnpm-lock.yaml` and `pnpm-workspace.yaml` through the `npm` ecosystem.
#
# Not here: `go.mod` toolchain bumps are the maintainers' call (the language
# ceiling of the binary is the toolchain that compiled it), and the pinned
# manifests (`tools/manifest.json`, `grammars/manifest.json`) are produced by
# their scripts.
#
# Also not here: `go-ladybug`. The Go binding is compiled against the native
# library that `scripts/fetch-ladybug.sh` pins by digest, and each binding
# release calls functions of the library release it was written for: 0.17.0
# needs symbols the pinned one lacks and does not build. Raise the binding and
# the library together, by hand.
#
# And the MCP SDK with `jsonschema-go`, which it generates the tool schemas
# with: 1.8.0 grows the published surface by 275 bytes, past the ceiling of
# `TestServerSurfaceStaysCheapToLoad`, and changes what `index_project` gets
# back from an accepted elicitation. The tool schemas are a compatibility
# surface (AGENTS.md), so that bump gets its own change.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: github.com/LadybugDB/go-ladybug
      - dependency-name: github.com/modelcontextprotocol/go-sdk
      - dependency-name: github.com/google/jsonschema-go
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ts-worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      worker-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      landing-minor-and-patch:
        update-types: [minor, patch]

  # Every action is pinned to a commit with its tag in a comment; Dependabot
  # keeps both in step.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-go
      - /.github/actions/setup-semantic-indexers
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
