name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# `setup-go` installs the toolchain from `go.mod` and is the only thing that
# should. Left on the default `auto`, `go` also fetches its own copy as the
# module `golang.org/toolchain@vX`, which lands in the module cache -- and the
# next run restores that cache on top of the toolchain `setup-go` just
# installed, so `tar x` hits "Cannot open: File exists" on hundreds of paths,
# exits 2, and the whole module cache silently fails to restore. Every run then
# re-downloads every module.
#
# `local` also turns a version mismatch into a loud failure instead of a silent
# download, which is the right trade for a project whose language ceiling is the
# toolchain that compiled it.
env:
  GOTOOLCHAIN: local
  # Every job here builds the binary and several run it, on five platforms, on
  # every push. Those are not machines anybody installed Kivgraph on, and
  # counting them would make the first-run number mostly us. The binary already
  # declines to report unless it is running from a release layout; the smoke
  # job builds exactly that layout, so this is the second half of the same
  # rule and it is set once for the whole file.
  KIVGRAPH_TELEMETRY: "0"

# A push that supersedes another leaves four jobs running for a commit nobody
# will merge, and the free plan allows twenty concurrent jobs across the
# account, so those are slots taken from the run that matters. The protected
# branches keep their own verdicts: release tags are cut from `main`, while
# `development` is the opt-in prerelease stream.
#
# That is why their group is the commit and not the branch. A group holds one
# running and one pending run, and a newer pending run replaces the older one
# whatever `cancel-in-progress` says: four merges in a row left the middle two
# cancelled in the queue, measured at eight cancelled pushes in fifteen hours.
concurrency:
  group: ci-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_only: ${{ steps.classify.outputs.release_only }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full: ${{ steps.classify.outputs.release_only != 'true' && steps.classify.outputs.docs_only != 'true' }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the revision
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          base_sha=""
          head_sha="$GITHUB_SHA"
          release_only_event=false
          case "$GITHUB_EVENT_NAME" in
            push)
              base_sha="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
              [[ "$GITHUB_REF_NAME" == main ]] && release_only_event=true
              ;;
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")"
              # `GITHUB_SHA` for a pull request is the synthetic merge commit;
              # classify the contributor's head so its release subject is
              # visible. The complete checkout still contains both commits.
              head_sha="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")"
              [[ "$GITHUB_BASE_REF" == main ]] && release_only_event=true
              ;;
            *)
              # The release workflow calls this file with workflow_call. That
              # path must always run the complete CI, regardless of the files
              # changed by the tagged commit.
              ;;
          esac

          # A later line with the same name wins, so this is the answer of
          # every path below that does not reach the documentation check.
          echo "docs_only=false" >> "$GITHUB_OUTPUT"

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo "release_only=false" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

          # A change that touches only documentation nothing reads skips the
          # build and test jobs: they would spend 24 runner-minutes, two of
          # the jobs on macOS, re-verifying code the change cannot reach.
          # `--no-renames` keeps the old name of a file renamed into
          # documentation in the list. A diff that cannot be computed is not
          # evidence, so it leaves the complete CI selected.
          scripts/classify-docs-change.sh selftest
          if paths="$(git diff --name-only --no-renames "$base_sha...$head_sha")"; then
            docs_only="$(scripts/classify-docs-change.sh <<<"$paths")"
            echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
            printf 'documentation-only change: %s\n' "$docs_only"
          fi

          if [[ "$release_only_event" != true ]]; then
            echo "release_only=false" >> "$GITHUB_OUTPUT"
            echo "release preparation shortcut is reserved for main"
            exit 0
          fi

          classifier="$RUNNER_TEMP/classify-release-change.sh"
          release_only=false
          if git show "$base_sha:scripts/classify-release-change.sh" >"$classifier" 2>/dev/null; then
            chmod +x "$classifier"
            if ! release_only="$("$classifier" "$GITHUB_EVENT_NAME" "$base_sha" "$head_sha")"; then
              release_only=false
            fi
            "$classifier" selftest
          else
            echo "trusted classifier is unavailable at $base_sha; using complete CI"
          fi
          echo "release_only=$release_only" >> "$GITHUB_OUTPUT"
          printf 'release-only change: %s\n' "$release_only"

  release_preparation:
    name: Validate release preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: classify
    if: needs.classify.outputs.release_only == 'true'
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          job: ${{ github.job }}

      - name: Check release metadata
        run: |
          go test ./internal/version
          go test ./cmd/kivgraph -run '^$'
          go vet ./internal/version ./cmd/kivgraph
          go run ./cmd/kivgraph version

      - name: Check documentation invariants
        shell: bash
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: scripts/check-docs.sh "$BASE_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Check landing release metadata
        working-directory: landing
        run: |
          pnpm install --frozen-lockfile
          pnpm check

  documentation:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check documentation invariants
        shell: bash
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: scripts/check-docs.sh "$BASE_SHA"

  semantic-coverage:
    name: Verify semantic coverage gates
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          job: ${{ github.job }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts-worker/pnpm-lock.yaml

      - name: Install TypeScript worker
        working-directory: ts-worker
        run: pnpm install --frozen-lockfile

      # The gate refuses to run without these: `verify-semantic-coverage.sh`
      # exits 1 on a missing indexer rather than skipping the language.
      - name: Set up the semantic indexers
        uses: ./.github/actions/setup-semantic-indexers

      - name: Run complete semantic coverage gate
        run: make semantic-coverage

  # The Go half of what used to be one job. The worker, the viewer and the
  # landing were checked after the Go suite on the same runner, which made this
  # the longest job of the workflow -- 4.8 min at the median -- for no reason
  # but the order of its steps: nothing below `Build Go` read anything above
  # it. They run in `packages` now, beside this one, and a Linux runner does
  # not queue.
  verify:
    name: Verify Go
    needs: classify
    if: needs.classify.outputs.full == 'true'
    # The image is pinned because the Go cache this job restores was saved on
    # it; `packages` is the job that needs the pin for its own sake.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The documentation ratchet compares against the merge base, which a
          # checkout of depth 1 does not hold.
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          job: ${{ github.job }}

      # Dart, pyright, scip-java and scip-dotnet are here for the same reason
      # rust-analyzer is: their suites skip without them, and a skipped suite
      # hides a whole language path from CI. They arrived with the coverage
      # floor -- which this job now gates -- and until then the Python
      # analyzer tests had never run in this workflow at all.
      - name: Set up the semantic indexers
        uses: ./.github/actions/setup-semantic-indexers

      - name: Set up Node.js for the analyzers
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install pyright
        run: npm install -g pyright@1.1.414

      # The Rust tests skip without a runnable analyzer, and a skipped suite
      # would hide the whole Rust path from CI. rustup ships a proxy named
      # rust-analyzer whether or not the component exists, so it has to be
      # added explicitly.
      #
      # `rust-src` is added with it, here and in every other job that runs the
      # analyzer. The hosted image does not carry it, and an analyzer that
      # finds it missing runs `rustup component add rust-src` itself. Two test
      # binaries starting together then race that install: the loser indexes
      # without a standard library while the probe the test makes afterwards
      # finds one, and `TestFullIndexesARustRepository` fails. Reproduced at
      # 7 of 8 concurrent first runs without the component and 0 of 24 with it.
      - name: Install pinned rust-analyzer
        run: |
          rustup component add rust-analyzer rust-src
          analyzer_dir="$(scripts/fetch-rust-analyzer.sh)"
          echo "$analyzer_dir" >> "$GITHUB_PATH"

      - name: Check Go formatting
        shell: bash
        run: |
          test -z "$(find . -type f -name '*.go' -not -path './.git/*' -exec gofmt -l {} +)"

      - name: Go vet
        run: go vet ./...

      # The workflow file is code too, and the failures it can carry are the
      # ones nobody notices: an expression that never evaluates, a heredoc that
      # does not close, a job that silently never dispatches. actionlint runs
      # shellcheck over every run block as well.
      - name: Lint the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      # Every class staticcheck has, minus the one that cannot be answered here.
      # This used to enumerate what was green -- SA*, then S1016/S1017, then
      # ST1005 -- and each addition was a commit that first emptied the class,
      # because a gate that starts red is one people learn to scroll past. With
      # ST1000 closed the enumeration inverted: under the default build `all`
      # reports 20 findings and all 20 are U1000. Naming the single exclusion
      # instead of the inclusions also gates the classes a future staticcheck
      # adds, which the enumeration silently would not.
      #
      # U1000 is excluded because it cannot be answered under this build, not
      # because it is noisy: the files behind the `ladybug` tag are not
      # analysed here, so every symbol whose caller lives in one of them looks
      # unreferenced. Those are the 20, and all 20 are false. `make
      # lint-ladybug` runs U1000 with the tag, where the answer is zero, and is
      # the only configuration that can state it.
      - name: Correctness lint
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 -checks='all,-U1000' ./...

      # Reachable vulnerabilities, not an advisory list: govulncheck exits
      # non-zero only for what this code calls. It is what found the five
      # standard-library advisories the toolchain bump closed, and the four in
      # the MCP transport that the SDK upgrade closed with it.
      #
      # On a pull request it reports and does not block. A published advisory
      # is about the toolchain or a dependency, not about the diff, and it
      # turned five open pull requests red in the same hour for something
      # none of them changed. `main` and a release still fail on it.
      - name: Vulnerability scan
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # The documentation invariants: every CLAUDE.md stays a symlink to the
      # AGENTS.md beside it, and a new line under docs/ stays inside 84 columns.
      # The base ref is what makes the second a ratchet over changed lines
      # instead of a demand to reflow forty existing files.
      - name: Check documentation invariants
        shell: bash
        run: |
          base="${{ github.base_ref || 'main' }}"
          git fetch --no-tags --depth=100 origin "$base"
          scripts/check-docs.sh "origin/$base"

      # The Go suite runs once, instrumented, and gates the coverage floor in
      # the same pass. `make coverage` measures with -coverpkg=./... while the
      # tests execute, so it cannot follow a plain `go test ./...` -- that
      # would be the same work twice, which is what it replaced. It emits the
      # same ::error:: annotations on failure, and refuses to run at all when
      # an analyzer is missing, because the low number that produces reads as
      # a floor breach and is really a toolchain nobody installed.
      - name: Go tests and coverage floor
        run: make coverage

      # The packages where a race is a data race and not a flake: the snapshot
      # store publishes by compare-and-swap, the follower installs generations
      # from another goroutine, the daemon serves sessions in parallel, and the
      # generation store holds a lock across a rename.
      - name: Selected Go race tests
        run: |
          go test -race \
            ./cmd/kivgraph/... \
            ./internal/hotsnapshot/... \
            ./internal/indexing/... \
            ./internal/daemon/... \
            ./internal/storage/generation/...

      - name: Build Go
        run: go build ./cmd/kivgraph

  packages:
    name: Verify the worker, web and landing packages
    needs: classify
    if: needs.classify.outputs.full == 'true'
    # Pinned, not ubuntu-latest: that label moved to 26.04, where the pinned
    # Playwright has no Chromium build and the end-to-end step cannot install.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The landing's sitemap dates every URL from the commit that last
          # touched its source, and refuses to publish a date it cannot
          # establish. At the default depth of 1 every file collapses onto the
          # tip commit, so this job would build -- and pass -- a sitemap with no
          # `lastmod` at all, which is not the artifact the deploy serves.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ts-worker/pnpm-lock.yaml
            web/pnpm-lock.yaml
            landing/pnpm-lock.yaml

      - name: Install TypeScript worker
        working-directory: ts-worker
        run: pnpm install --frozen-lockfile

      - name: Check worker formatting
        working-directory: ts-worker
        run: pnpm format:check

      - name: Lint TypeScript worker
        working-directory: ts-worker
        run: pnpm lint

      - name: Typecheck TypeScript worker
        working-directory: ts-worker
        run: pnpm typecheck

      - name: Test TypeScript worker
        working-directory: ts-worker
        run: pnpm test

      - name: Build TypeScript worker
        working-directory: ts-worker
        run: pnpm build

      - name: Install web package
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check web package
        working-directory: web
        run: pnpm check

      - name: Build web package
        working-directory: web
        run: pnpm build

      - name: Install Chromium for web end-to-end tests
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Test large topology in Chromium
        working-directory: web
        run: pnpm test:e2e

      - name: Install landing package
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Check landing package
        working-directory: landing
        run: pnpm check

      - name: Build landing package
        working-directory: landing
        run: pnpm build

      - name: Audit landing SEO and AEO surfaces
        working-directory: landing
        run: node scripts/seo-audit.mjs

  linux-bundle:
    name: Build and verify the Linux distribution bundle
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          job: ${{ github.job }}

      - name: Set up pnpm for distribution
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.1

      - name: Set up Node.js for distribution
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ts-worker/pnpm-lock.yaml
            web/pnpm-lock.yaml

      # The bundle rewrites the executable's RUNPATH to the relative entry,
      # dropping the one the Go binding points at its own module directory.
      #
      # The runner points apt at a mirrorlist -- azure.archive.ubuntu.com
      # first, archive.ubuntu.com as fallback. When the Azure mirror
      # black-holes connections instead of refusing them, apt pays its default
      # 30 s connect timeout plus ~7 s of backoff *per index file* before
      # failing over, which turned this step into ten minutes of `Ign:` lines.
      # Bounding the timeout keeps the fast path fast and the failover cheap.
      - name: Install patchelf
        run: |
          sudo apt-get update \
            -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=5 \
            -o Acquire::https::Timeout=5
          sudo apt-get install -y patchelf

      - name: Cache pinned LadybugDB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tooling/ladybug
          key: ladybug-linux-amd64-${{ hashFiles('scripts/fetch-ladybug.sh', 'docs/dependencies/ladybugdb.md') }}

      # The Rust engine is a 40 MB download the bundle carries; the digest in
      # the manifest is what makes the cache safe to reuse.
      - name: Cache pinned rust-analyzer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tooling/rust-analyzer
          key: rust-analyzer-linux-amd64-${{ hashFiles('tools/manifest.json', 'scripts/fetch-rust-analyzer.sh') }}

      - name: Build Linux distribution bundle
        run: make build-linux-amd64

      - name: Verify Linux distribution bundle
        shell: bash
        run: |
          scripts/verify-bundle.sh \
            --bundle dist/kivgraph-linux-amd64 \
            --target linux/amd64 \
            --commit "$GITHUB_SHA" \
            --source-tools-manifest tools/manifest.json

      # AGENTS.md requires a clean distribution build to be reproducible
      # between checkouts of the same commit, comparing the whole payload, and
      # nothing verified it. Two builds prove it across invocations; a second
      # host is out of reach of one job. Measured at 769 identical files.
      - name: Verify the bundle builds reproducibly
        run: scripts/check-reproducible-bundle.sh

      - name: Upload Linux distribution bundle for smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-bundle
          path: dist/kivgraph-linux-amd64
          if-no-files-found: error
          retention-days: 1

  ladybug:
    name: Verify against a real LadybugDB
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          job: ${{ github.job }}

      - name: Install pinned rust-analyzer
        run: |
          rustup component add rust-analyzer rust-src
          analyzer_dir="$(scripts/fetch-rust-analyzer.sh)"
          echo "$analyzer_dir" >> "$GITHUB_PATH"

      - name: Cache pinned LadybugDB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tooling/ladybug
          key: ladybug-linux-amd64-${{ hashFiles('scripts/fetch-ladybug.sh', 'docs/dependencies/ladybugdb.md') }}

      # The dead-code check belongs beside the native test suite: the default
      # build does not analyse the files behind the `ladybug` tag, so 20 symbols
      # whose callers live there look unreferenced -- every one a false positive.
      # With the tag the answer is zero, which is what makes it a gate rather than
      # a wish. The answer does not depend on the platform, so the macOS job does
      # not repeat it.
      - name: Dead code, in the configuration that can answer
        run: make lint-ladybug

      - name: Go tests with LadybugDB
        run: make test-ladybug

  smoke:
    name: Serve a graph the bundle built itself
    needs:
      - classify
      - linux-bundle
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # This is the flow AGENTS.md requires before closing an installation change,
    # and until now a person ran it by hand when they remembered. The two defects
    # of PR #21 -- trace_dependencies and get_blast_radius answering
    # SNAPSHOT_UNAVAILABLE on any Go type with methods -- passed every test with a
    # fixture and only failed against a real published generation. No other job
    # publishes one, which is why they shipped in v0.8.0.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          job: ${{ github.job }}

      - name: Download Linux distribution bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-bundle
          path: dist/kivgraph-linux-amd64

      # upload-artifact preserves file contents but not executable modes. The
      # bundle is still the exact producer output: this only restores the modes
      # required to execute its binaries and TypeScript engine after transport.
      - name: Restore bundle executable modes
        shell: bash
        run: |
          find dist/kivgraph-linux-amd64/bin -type f -exec chmod 0755 {} +
          typescript_engine="$(find \
            dist/kivgraph-linux-amd64/worker/node_modules/@typescript \
            -type f -name tsc -print -quit)"
          test -n "$typescript_engine"
          chmod 0755 "$typescript_engine"

      - name: Add bundled tools to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/dist/kivgraph-linux-amd64/bin" >> "$GITHUB_PATH"

      - name: Verify downloaded Linux distribution checksums
        run: |
          cd dist/kivgraph-linux-amd64
          sha256sum -c SHA256SUMS

      # A temporary HOME, because this must not read or write the runner's
      # configuration, and because a fresh HOME is what a first install is.
      #
      # The module cache is exported back in on purpose, and the rehearsal is why:
      # GOMODCACHE defaults inside HOME, so a fresh one hides the cache from
      # go/packages, the main module fails to type-check, and the pass indexes
      # 63 Go definitions instead of 10075 -- and publishes a generation, and
      # passes. A gate that green-lights a hollow graph is worse than no gate.
      # An index type-checks every package of every registered module, and
      # this job only built ./cmd/kivgraph -- so the dependencies imported
      # solely by benchmarks/ were never downloaded. The loader reports
      # such a module as MODULE_NOT_LOADED and publishes the rest, which
      # is how the pass indexed 63 definitions instead of 10075 while
      # reporting success. A warm cache is a precondition of loading Go,
      # not part of what this gate measures.
      - name: Download what the pass will type-check
        run: go mod download

      - name: Index with the bundled binary
        shell: bash
        run: |
          set -euo pipefail
          # Captured before HOME moves: GOMODCACHE defaults inside HOME, so a
          # fresh one hides the module cache from go/packages, the main module
          # fails to type-check and the pass indexes 63 Go definitions instead
          # of 10075 -- measured both ways while rehearsing this job. It still
          # publishes a generation and it still passes, and a gate that
          # green-lights a hollow graph is worse than no gate. GOPATH travels
          # with it because the two are read as a pair.
          gomodcache="$(go env GOMODCACHE)"
          gopath="$(go env GOPATH)"
          export HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$HOME"
          export GOMODCACHE="$gomodcache" GOPATH="$gopath"
          echo "GOMODCACHE=$gomodcache" >> "$GITHUB_ENV"
          echo "GOPATH=$gopath" >> "$GITHUB_ENV"

          bundle="$PWD/dist/kivgraph-linux-amd64/bin/kivgraph"
          "$bundle" init --repository kivgraph="$PWD" --languages go,typescript
          "$bundle" doctor
          "$bundle" index --full --json | tee "$RUNNER_TEMP/index.json" | tail -1

          # The graph has to be worth serving: below this the pass loaded almost
          # nothing and every query after it would answer about an empty corpus.
          #
          # The floors hold because HOME is new on every run, so the fact cache
          # is cold and the counters report the whole pass. A warm one reports
          # only what it loaded anew, which is why these numbers do not mean the
          # same thing on a workstation that has indexed before.
          definitions="$(jq -rs 'map(select(.event == "result"))[-1].result.index.go_definitions' "$RUNNER_TEMP/index.json")"
          symbols="$(jq -rs 'map(select(.event == "result"))[-1].result.index.typescript_symbols' "$RUNNER_TEMP/index.json")"
          printf 'go definitions %s, typescript symbols %s\n' "$definitions" "$symbols"
          test "$definitions" -ge 5000
          test "$symbols" -ge 1000

      # Registered is not the same as working. Every reference tool is called
      # with a real symbol of the graph that was just published, and the two
      # traversals at depth two -- the depth that leaves the symbol and walks an
      # edge, and the depth at which both answered SNAPSHOT_UNAVAILABLE in
      # v0.8.0 while every fixture test in the repository passed.
      # A floor that trips says the graph is hollow and not why. The loader
      # already wrote the reason -- a module it could not load, and the
      # go command's own stderr -- so a failing gate prints it instead of
      # sending the next reader to reproduce the pass by hand.
      - name: Explain a hollow pass
        if: failure()
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/smoke-home"
          go env GOMODCACHE GOPATH GOTOOLCHAIN GOFLAGS GOCACHE
          go version
          bundle="$PWD/dist/kivgraph-linux-amd64/bin/kivgraph"
          "$bundle" logs --kind index --json | tail -c 2000
          # The reason a module did not load only travels on the human
          # path -- index.go.not_read, one line per module -- so the pass
          # runs again without --json to say what it could not read.
          "$bundle" index --full 2>&1 | grep -E 'index\.go' | head -30

      - name: Prove every tool answers about the graph it just built
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/smoke-home"
          go run ./benchmarks/mcp-token-cost \
            --server "$PWD/dist/kivgraph-linux-amd64/bin/kivgraph" \
            --smoke

  # darwin/arm64 is published and cannot be cross-compiled: cgo links the
  # pinned LadybugDB library, so the only machine that can build this bundle
  # is a macOS one. Until this job existed the darwin payload was first built
  # at tag time, which put its platform-specific half -- the load commands
  # rewritten after linking, the ad-hoc signature Apple Silicon requires to
  # execute at all -- behind a version number that a failure burns.
  darwin-bundle:
    name: Build the macOS bundle a release publishes
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          job: ${{ github.job }}

      - name: Install pinned rust-analyzer
        run: |
          rustup component add rust-analyzer rust-src
          analyzer_dir="$(scripts/fetch-rust-analyzer.sh)"
          echo "$analyzer_dir" >> "$GITHUB_PATH"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ts-worker/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Cache pinned LadybugDB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tooling/ladybug
          key: ladybug-darwin-arm64-${{ hashFiles('scripts/fetch-ladybug.sh', 'docs/dependencies/ladybugdb.md') }}

      - name: Cache pinned rust-analyzer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tooling/rust-analyzer
          key: rust-analyzer-darwin-arm64-${{ hashFiles('tools/manifest.json', 'scripts/fetch-rust-analyzer.sh') }}

      - name: Build the macOS bundle
        run: make build-darwin-arm64

      # The shared verifier owns the bundle contract. Everything left here is
      # specific to Mach-O: RUNPATH and the ad-hoc signature.
      - name: Verify the macOS bundle
        shell: bash
        run: |
          bundle=dist/kivgraph-darwin-arm64
          scripts/verify-bundle.sh \
            --bundle "$bundle" \
            --target darwin/arm64 \
            --commit "$GITHUB_SHA" \
            --source-tools-manifest tools/manifest.json

          # AGENTS.md: the executable declares exactly one RUNPATH, the
          # relative one. build-bundle.sh drops the one the Go binding points
          # at its own module directory, and a second surviving entry makes an
          # installed bundle load a library from wherever that path resolves.
          rpaths=$(otool -l "$bundle/bin/kivgraph" | grep -c LC_RPATH)
          test "$rpaths" -eq 1
          otool -l "$bundle/bin/kivgraph" | grep -q '@loader_path/../lib'

          # Editing those load commands invalidates the signature, and Apple
          # Silicon refuses to execute an unsigned binary at all -- so the
          # re-signing step is load-bearing, and the assertion is that the
          # signature is the ad-hoc one and that the binary runs.
          codesign -dv "$bundle/bin/kivgraph" 2>&1 | grep -q 'Signature=adhoc'

      # The reproducibility rule is not platform-specific and its darwin half
      # was never checked: the scripts default to the host target, so this is
      # the same gate the Linux job runs, on the other published platform.
      - name: Verify the macOS bundle builds reproducibly
        run: scripts/check-reproducible-bundle.sh

  macos:
    name: Verify Go on macOS arm64
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          job: ${{ github.job }}

      - name: Install pinned rust-analyzer
        run: |
          rustup component add rust-analyzer rust-src
          analyzer_dir="$(scripts/fetch-rust-analyzer.sh)"
          echo "$analyzer_dir" >> "$GITHUB_PATH"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ts-worker/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Go vet
        run: go vet ./...

      # No untagged `go test ./...` here. `make test-ladybug` below runs the
      # same packages plus the tagged ones, so the untagged pass only added the
      # `!ladybug` fallback files -- which are not platform specific and run in
      # `verify`. It cost 132 s of the job that sets this workflow's duration.
      # The worker suite is platform sensitive: the engine reports paths with
      # the casing of the volume, and this one folds case.
      - name: Install TypeScript worker
        working-directory: ts-worker
        run: pnpm install --frozen-lockfile

      - name: Test TypeScript worker
        working-directory: ts-worker
        run: pnpm test

      # darwin/arm64 links its own pinned LadybugDB build, so the pairing of
      # the pinned core and the pinned Go binding is verified per platform: a
      # mismatched pair segfaults on the first C call instead of failing a
      # test.
      - name: Fetch the pinned LadybugDB library
        run: scripts/fetch-ladybug.sh

      - name: Go tests with LadybugDB
        run: make test-ladybug

  # windows-cross is a compile gate and deliberately nothing more. It cannot
  # run what it builds, and windows/amd64 is not a published target: what it
  # buys is that the next unguarded `syscall.Kill` or `flock` fails here
  # instead of surviving until somebody tries to add the platform. The two
  # missing lock files this job would have caught got in exactly that way.
  #
  # It runs on Linux rather than on a Windows runner because the question it
  # asks is about the source, not about the machine: whether every package
  # still has an implementation for this GOOS. Answering it needs a C compiler
  # for the target -- the tree-sitter grammars are cgo -- and mingw-w64 is the
  # whole of that.
  windows-cross:
    name: Cross-compile for windows/amd64
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "1"
      CC: x86_64-w64-mingw32-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # These scripts are not exercised by the Go test suite: a syntax error in
      # either one is published and downloaded before anyone finds out. The
      # Linux runners ship PowerShell, so parsing costs seconds and needs no
      # Windows job.
      - name: Parse the Windows installer and uninstaller
        shell: pwsh
        run: |
          foreach ($script in @('scripts/install.ps1', 'scripts/uninstall.ps1')) {
            $problems = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref] $null, [ref] $problems) | Out-Null
            if ($problems) {
              $problems | ForEach-Object { Write-Host $_.ToString() }
              exit 1
            }
            Write-Host "$script parses"
          }

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          job: ${{ github.job }}

      - name: Install the Windows C cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64

      - name: Build for windows/amd64
        run: go build ./...

      # The three Unix-only calls that were left in this tree were all in test
      # files, which `go build` never reads. `go vet` type-checks them, so it
      # is the half of this job that earns its place.
      - name: Vet for windows/amd64
        run: go vet ./...

  ci_result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - classify
      - release_preparation
      - semantic-coverage
      - documentation
      - verify
      - packages
      - linux-bundle
      - ladybug
      - smoke
      - darwin-bundle
      - macos
      - windows-cross
    steps:
      - name: Check the selected path
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RELEASE_ONLY: ${{ needs.classify.outputs.release_only }}
          RELEASE_PREPARATION_RESULT: ${{ needs.release_preparation.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          SEMANTIC_COVERAGE_RESULT: ${{ needs['semantic-coverage'].result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          LINUX_BUNDLE_RESULT: ${{ needs['linux-bundle'].result }}
          LADYBUG_RESULT: ${{ needs.ladybug.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          DARWIN_BUNDLE_RESULT: ${{ needs['darwin-bundle'].result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_CROSS_RESULT: ${{ needs['windows-cross'].result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]] ||
            { echo "change classification failed" >&2; exit 1; }

          if [[ "$RELEASE_ONLY" == true ]]; then
            [[ "$RELEASE_PREPARATION_RESULT" == success ]] ||
              { echo "release preparation failed" >&2; exit 1; }
            echo "release preparation path passed"
            exit 0
          fi

          if [[ "$DOCS_ONLY" == true ]]; then
            [[ "$DOCUMENTATION_RESULT" == success ]] ||
              { echo "documentation validation failed" >&2; exit 1; }
            echo "documentation path passed"
            exit 0
          fi

          for result in \
            "$SEMANTIC_COVERAGE_RESULT" \
            "$VERIFY_RESULT" \
            "$PACKAGES_RESULT" \
            "$LINUX_BUNDLE_RESULT" \
            "$LADYBUG_RESULT" \
            "$SMOKE_RESULT" \
            "$DARWIN_BUNDLE_RESULT" \
            "$MACOS_RESULT" \
            "$WINDOWS_CROSS_RESULT"; do
            [[ "$result" == success ]] ||
              { echo "complete CI result: $result" >&2; exit 1; }
          done
          echo "complete CI path passed"
