name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# `setup-go` installs the toolchain from `go.mod` and is the only thing that
# should. Left on the default `auto`, `go` also fetches its own copy as the
# module `golang.org/toolchain@vX`, which lands in the module cache -- and the
# next run restores that cache on top of the toolchain `setup-go` just
# installed, so `tar x` hits "Cannot open: File exists" on hundreds of paths,
# exits 2, and the whole module cache silently fails to restore. Every run then
# re-downloads every module.
#
# `local` also turns a version mismatch into a loud failure instead of a silent
# download, which is the right trade for a project whose language ceiling is the
# toolchain that compiled it.
env:
  GOTOOLCHAIN: local

# A push that supersedes another leaves four jobs running for a commit nobody
# will merge, and the free plan allows twenty concurrent jobs across the
# account, so those are slots taken from the run that matters. main is excluded:
# its history is what release tags are cut from, so every commit on it keeps its
# own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  semantic-coverage:
    name: Verify semantic coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts-worker/pnpm-lock.yaml

      - name: Install TypeScript worker
        working-directory: ts-worker
        run: pnpm install --frozen-lockfile

      - name: Run complete semantic coverage gate
        run: make semantic-coverage

  verify:
    name: Verify Go, web and landing packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The landing's sitemap dates every URL from the commit that last
          # touched its source, and refuses to publish a date it cannot
          # establish. At the default depth of 1 every file collapses onto the
          # tip commit, so this job would build -- and pass -- a sitemap with no
          # `lastmod` at all, which is not the artifact the deploy serves.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The Rust tests skip without a runnable analyzer, and a skipped suite
      # would hide the whole Rust path from CI. rustup ships a proxy named
      # rust-analyzer whether or not the component exists, so it has to be
      # added explicitly.
      - name: Install pinned rust-analyzer
        run: |
          rustup component add rust-analyzer
          analyzer_dir="$(scripts/fetch-rust-analyzer.sh)"
          echo "$analyzer_dir" >> "$GITHUB_PATH"

      - name: Check Go formatting
        shell: bash
        run: |
          test -z "$(find . -type f -name '*.go' -not -path './.git/*' -exec gofmt -l {} +)"

      - name: Go vet
        run: go vet ./...

      # The workflow file is code too, and the failures it can carry are the
      # ones nobody notices: an expression that never evaluates, a heredoc that
      # does not close, a job that silently never dispatches. actionlint runs
      # shellcheck over every run block as well.
      - name: Lint the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      # Correctness first, then the LUQUE-2231 classes as each one closes. A
      # gate that starts red is one people learn to scroll past, so a class is
      # added here on the commit that empties it, never before. The SA classes
      # describe a bug and were green when this was added; S1016 and S1017
      # joined with the five duplicate shapes they named, and holding them here
      # is what stops a sixth from being written. U1000 cannot join: under the
      # default build the files behind the `ladybug` tag are not analysed, so
      # every symbol whose caller lives in one of them looks unreferenced --
      # measured at 20 findings, all false. It lives in `make lint-ladybug`,
      # the only configuration that can answer it. ST1005 is what is left.
      - name: Correctness lint
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 -checks='SA*,S1016,S1017' ./...

      # Reachable vulnerabilities, not an advisory list: govulncheck exits
      # non-zero only for what this code calls. It is what found the five
      # standard-library advisories the toolchain bump closed, and the four in
      # the MCP transport that the SDK upgrade closed with it.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # The documentation invariants: every CLAUDE.md stays a symlink to the
      # AGENTS.md beside it, and a new line under docs/ stays inside 84 columns.
      # The base ref is what makes the second a ratchet over changed lines
      # instead of a demand to reflow forty existing files.
      - name: Check documentation invariants
        shell: bash
        run: |
          base="${{ github.base_ref || 'main' }}"
          git fetch --no-tags --depth=100 origin "$base"
          scripts/check-docs.sh "origin/$base"

      # A failing Go test is reported as an annotation so the reason is visible
      # on the run without opening the log.
      - name: Go tests
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log" && exit 0
          grep -E '^(--- )?FAIL|\.go:[0-9]+:' "$RUNNER_TEMP/go-test.log" |
            head -20 |
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          exit 1

      # The packages where a race is a data race and not a flake: the snapshot
      # store publishes by compare-and-swap, the follower installs generations
      # from another goroutine, the daemon serves sessions in parallel, and the
      # generation store holds a lock across a rename.
      - name: Selected Go race tests
        run: |
          go test -race \
            ./cmd/kivgraph/... \
            ./internal/hotsnapshot/... \
            ./internal/indexing/... \
            ./internal/daemon/... \
            ./internal/storage/generation/...

      - name: Build Go
        run: go build ./cmd/kivgraph

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ts-worker/pnpm-lock.yaml
            web/pnpm-lock.yaml
            landing/pnpm-lock.yaml

      - name: Install TypeScript worker
        working-directory: ts-worker
        run: pnpm install --frozen-lockfile

      - name: Check worker formatting
        working-directory: ts-worker
        run: pnpm format:check

      - name: Lint TypeScript worker
        working-directory: ts-worker
        run: pnpm lint

      - name: Typecheck TypeScript worker
        working-directory: ts-worker
        run: pnpm typecheck

      - name: Test TypeScript worker
        working-directory: ts-worker
        run: pnpm test

      - name: Build TypeScript worker
        working-directory: ts-worker
        run: pnpm build

      - name: Install web package
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check web package
        working-directory: web
        run: pnpm check

      - name: Build web package
        working-directory: web
        run: pnpm build

      - name: Install landing package
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Check landing package
        working-directory: landing
        run: pnpm check

      - name: Build landing package
        working-directory: landing
        run: pnpm build

  ladybug:
    name: Verify against a real LadybugDB
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install pinned rust-analyzer
        run: |
          rustup component add rust-analyzer
          analyzer_dir="$(scripts/fetch-rust-analyzer.sh)"
          echo "$analyzer_dir" >> "$GITHUB_PATH"

      - name: Set up pnpm for distribution
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Set up Node.js for distribution
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ts-worker/pnpm-lock.yaml
            web/pnpm-lock.yaml

      # The bundle rewrites the executable's RUNPATH to the relative entry,
      # dropping the one the Go binding points at its own module directory.
      #
      # The runner points apt at a mirrorlist -- azure.archive.ubuntu.com
      # first, archive.ubuntu.com as fallback. When the Azure mirror
      # black-holes connections instead of refusing them, apt pays its default
      # 30 s connect timeout plus ~7 s of backoff *per index file* before
      # failing over, which turned this step into ten minutes of `Ign:` lines.
      # Bounding the timeout keeps the fast path fast and the failover cheap.
      - name: Install patchelf
        run: |
          sudo apt-get update \
            -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=5 \
            -o Acquire::https::Timeout=5
          sudo apt-get install -y patchelf

      # The Rust engine is a 40 MB download the bundle carries; the digest in
      # the manifest is what makes the cache safe to reuse.
      - name: Cache pinned rust-analyzer
        uses: actions/cache@v6
        with:
          path: .tooling/rust-analyzer
          key: rust-analyzer-linux-amd64-${{ hashFiles('tools/manifest.json', 'scripts/fetch-rust-analyzer.sh') }}

      - name: Build Linux distribution bundle
        run: make build-linux-amd64

      - name: Verify Linux distribution checksums
        run: |
          cd dist/kivgraph-linux-amd64
          sha256sum -c SHA256SUMS

      # A Linux bundle is the one nobody can build on a macOS workstation, so
      # this job is where the Rust engine of that platform is proven to be
      # present, executable and the pinned one.
      - name: Verify the bundled Rust engine
        run: |
          bundle=dist/kivgraph-linux-amd64
          pinned=$(jq -r '.tools[] | select(.name=="rust-analyzer") | .release' tools/manifest.json)
          test -x "$bundle/bin/rust-analyzer"
          test "$(jq -r .tools.rust_analyzer.release "$bundle/manifest.json")" = "$pinned"
          test "$("$bundle/bin/kivgraph" version --json | jq -r .rust_analyzer)" = "$pinned"
          "$bundle/bin/rust-analyzer" --version

      # AGENTS.md requires a clean distribution build to be reproducible
      # between checkouts of the same commit, comparing the whole payload, and
      # nothing verified it. Two builds prove it across invocations; a second
      # host is out of reach of one job. Measured at 769 identical files.
      - name: Verify the bundle builds reproducibly
        run: scripts/check-reproducible-bundle.sh

      # The pinned core and the pinned Go binding must share a version: a
      # mismatched pair segfaults on the first C call instead of failing a
      # test, which is why this job exists at all.
      - name: Fetch the pinned LadybugDB library
        run: scripts/fetch-ladybug.sh

      # The dead-code check belongs here because this is the only Linux job
      # that builds the tag. Under the default configuration the files behind
      # it are not analysed, so 20 symbols whose callers live there look
      # unreferenced -- every one a false positive. With the tag the answer is
      # zero, which is what makes it a gate rather than a wish. The answer does
      # not depend on the platform, so the macOS job does not repeat it.
      - name: Dead code, in the configuration that can answer
        run: make lint-ladybug

      - name: Go tests with LadybugDB
        run: make test-ladybug

  smoke:
    name: Serve a graph the bundle built itself
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # This is the flow AGENTS.md requires before closing an installation change,
    # and until now a person ran it by hand when they remembered. The two defects
    # of PR #21 -- trace_dependencies and get_blast_radius answering
    # SNAPSHOT_UNAVAILABLE on any Go type with methods -- passed every test with a
    # fixture and only failed against a real published generation. No other job
    # publishes one, which is why they shipped in v0.8.0.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install pinned rust-analyzer
        run: |
          rustup component add rust-analyzer
          analyzer_dir="$(scripts/fetch-rust-analyzer.sh)"
          echo "$analyzer_dir" >> "$GITHUB_PATH"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ts-worker/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install patchelf
        run: |
          sudo apt-get update \
            -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=5 \
            -o Acquire::https::Timeout=5
          sudo apt-get install -y patchelf

      - name: Cache pinned rust-analyzer
        uses: actions/cache@v6
        with:
          path: .tooling/rust-analyzer
          key: rust-analyzer-linux-amd64-${{ hashFiles('tools/manifest.json', 'scripts/fetch-rust-analyzer.sh') }}

      # The binary under test is the one a user downloads, not `go run`: the
      # bundle carries the native library, the worker and the RUNPATH, and every
      # one of those is a way for an install to be broken while the tests pass.
      - name: Build the distribution bundle
        run: make build-linux-amd64

      # A temporary HOME, because this must not read or write the runner's
      # configuration, and because a fresh HOME is what a first install is.
      #
      # The module cache is exported back in on purpose, and the rehearsal is why:
      # GOMODCACHE defaults inside HOME, so a fresh one hides the cache from
      # go/packages, the main module fails to type-check, and the pass indexes
      # 63 Go definitions instead of 10075 -- and publishes a generation, and
      # passes. A gate that green-lights a hollow graph is worse than no gate.
      # An index type-checks every package of every registered module, and
      # this job only built ./cmd/kivgraph -- so the dependencies imported
      # solely by benchmarks/ were never downloaded. The loader reports
      # such a module as MODULE_NOT_LOADED and publishes the rest, which
      # is how the pass indexed 63 definitions instead of 10075 while
      # reporting success. A warm cache is a precondition of loading Go,
      # not part of what this gate measures.
      - name: Download what the pass will type-check
        run: go mod download

      - name: Index with the bundled binary
        shell: bash
        run: |
          set -euo pipefail
          # Captured before HOME moves: GOMODCACHE defaults inside HOME, so a
          # fresh one hides the module cache from go/packages, the main module
          # fails to type-check and the pass indexes 63 Go definitions instead
          # of 10075 -- measured both ways while rehearsing this job. It still
          # publishes a generation and it still passes, and a gate that
          # green-lights a hollow graph is worse than no gate. GOPATH travels
          # with it because the two are read as a pair.
          gomodcache="$(go env GOMODCACHE)"
          gopath="$(go env GOPATH)"
          export HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$HOME"
          export GOMODCACHE="$gomodcache" GOPATH="$gopath"
          echo "GOMODCACHE=$gomodcache" >> "$GITHUB_ENV"
          echo "GOPATH=$gopath" >> "$GITHUB_ENV"

          bundle="$PWD/dist/kivgraph-linux-amd64/bin/kivgraph"
          "$bundle" init --repository kivgraph="$PWD" --languages go,typescript
          "$bundle" doctor
          "$bundle" index --full --json | tee "$RUNNER_TEMP/index.json" | tail -1

          # The graph has to be worth serving: below this the pass loaded almost
          # nothing and every query after it would answer about an empty corpus.
          #
          # The floors hold because HOME is new on every run, so the fact cache
          # is cold and the counters report the whole pass. A warm one reports
          # only what it loaded anew, which is why these numbers do not mean the
          # same thing on a workstation that has indexed before.
          definitions="$(jq -rs 'map(select(.event == "result"))[-1].result.index.go_definitions' "$RUNNER_TEMP/index.json")"
          symbols="$(jq -rs 'map(select(.event == "result"))[-1].result.index.typescript_symbols' "$RUNNER_TEMP/index.json")"
          printf 'go definitions %s, typescript symbols %s\n' "$definitions" "$symbols"
          test "$definitions" -ge 5000
          test "$symbols" -ge 1000

      # Registered is not the same as working. Every reference tool is called
      # with a real symbol of the graph that was just published, and the two
      # traversals at depth two -- the depth that leaves the symbol and walks an
      # edge, and the depth at which both answered SNAPSHOT_UNAVAILABLE in
      # v0.8.0 while every fixture test in the repository passed.
      # A floor that trips says the graph is hollow and not why. The loader
      # already wrote the reason -- a module it could not load, and the
      # go command's own stderr -- so a failing gate prints it instead of
      # sending the next reader to reproduce the pass by hand.
      - name: Explain a hollow pass
        if: failure()
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/smoke-home"
          go env GOMODCACHE GOPATH GOTOOLCHAIN GOFLAGS GOCACHE
          go version
          bundle="$PWD/dist/kivgraph-linux-amd64/bin/kivgraph"
          "$bundle" logs --kind index --json | tail -c 2000
          # The reason a module did not load only travels on the human
          # path -- index.go.not_read, one line per module -- so the pass
          # runs again without --json to say what it could not read.
          "$bundle" index --full 2>&1 | grep -E 'index\.go' | head -30

      - name: Prove every tool answers about the graph it just built
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/smoke-home"
          go run ./benchmarks/mcp-token-cost \
            --server "$PWD/dist/kivgraph-linux-amd64/bin/kivgraph" \
            --smoke

  # darwin/arm64 is published and cannot be cross-compiled: cgo links the
  # pinned LadybugDB library, so the only machine that can build this bundle
  # is a macOS one. Until this job existed the darwin payload was first built
  # at tag time, which put its platform-specific half -- the load commands
  # rewritten after linking, the ad-hoc signature Apple Silicon requires to
  # execute at all -- behind a version number that a failure burns.
  darwin-bundle:
    name: Build the macOS bundle a release publishes
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install pinned rust-analyzer
        run: |
          rustup component add rust-analyzer
          analyzer_dir="$(scripts/fetch-rust-analyzer.sh)"
          echo "$analyzer_dir" >> "$GITHUB_PATH"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ts-worker/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Cache pinned LadybugDB
        uses: actions/cache@v6
        with:
          path: .tooling/ladybug
          key: ladybug-darwin-arm64-${{ hashFiles('scripts/fetch-ladybug.sh', 'docs/dependencies/ladybugdb.md') }}

      - name: Cache pinned rust-analyzer
        uses: actions/cache@v6
        with:
          path: .tooling/rust-analyzer
          key: rust-analyzer-darwin-arm64-${{ hashFiles('tools/manifest.json', 'scripts/fetch-rust-analyzer.sh') }}

      - name: Build the macOS bundle
        run: make build-darwin-arm64

      # Everything here is either specific to Mach-O or specific to being
      # published. The checksum tool is shasum: macOS ships no sha256sum.
      - name: Verify the macOS bundle
        shell: bash
        run: |
          bundle=dist/kivgraph-darwin-arm64
          (cd "$bundle" && shasum -a 256 -c SHA256SUMS >/dev/null)

          # AGENTS.md: the executable declares exactly one RUNPATH, the
          # relative one. build-bundle.sh drops the one the Go binding points
          # at its own module directory, and a second surviving entry makes an
          # installed bundle load a library from wherever that path resolves.
          rpaths=$(otool -l "$bundle/bin/kivgraph" | grep -c LC_RPATH)
          test "$rpaths" -eq 1
          otool -l "$bundle/bin/kivgraph" | grep -q '@loader_path/../lib'

          # Editing those load commands invalidates the signature, and Apple
          # Silicon refuses to execute an unsigned binary at all -- so the
          # re-signing step is load-bearing, and the assertion is that the
          # signature is the ad-hoc one and that the binary runs.
          codesign -dv "$bundle/bin/kivgraph" 2>&1 | grep -q 'Signature=adhoc'
          test -f "$bundle/lib/liblbug.dylib"

          # version --json carries no platform field, so the manifest is what
          # names the target, and the binary that answers is the one built for
          # it: a bundle assembled for the wrong platform cannot run here.
          version_json=$("$bundle/bin/kivgraph" version --json)
          test "$(jq -r .dirty <<<"$version_json")" = "false"
          test "$(jq -r .target.os "$bundle/manifest.json")" = "darwin"
          test "$(jq -r .target.arch "$bundle/manifest.json")" = "arm64"
          test "$(jq -r .source.dirty "$bundle/manifest.json")" = "false"
          test "$(jq -r .source.commit "$bundle/manifest.json")" = "$GITHUB_SHA"
          test "$(jq -r .schema <<<"$version_json")" = "$(jq -r .schema.canonical "$bundle/manifest.json")"

          # The engine has to be the pinned one on this platform too: an
          # installation that falls back to the PATH indexes a different graph.
          pinned=$(jq -r '.tools[] | select(.name=="rust-analyzer") | .release' tools/manifest.json)
          test -x "$bundle/bin/rust-analyzer"
          test "$(jq -r .rust_analyzer <<<"$version_json")" = "$pinned"
          "$bundle/bin/rust-analyzer" --version

          # The viewer ships, and the binary must be able to serve it.
          test -f "$bundle/web/index.html"
          help_output=$("$bundle/bin/kivgraph" --help)
          grep -q '^  ui \[' <<<"$help_output"
          if grep -q 'unavailable: this build carries no web bundle' <<<"$help_output"; then
            echo "bundle carries web assets the binary cannot serve" >&2
            exit 1
          fi
          test ! -e "$bundle/landing"

      # The reproducibility rule is not platform-specific and its darwin half
      # was never checked: the scripts default to the host target, so this is
      # the same gate the Linux job runs, on the other published platform.
      - name: Verify the macOS bundle builds reproducibly
        run: scripts/check-reproducible-bundle.sh

  macos:
    name: Verify Go on macOS arm64
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install pinned rust-analyzer
        run: |
          rustup component add rust-analyzer
          analyzer_dir="$(scripts/fetch-rust-analyzer.sh)"
          echo "$analyzer_dir" >> "$GITHUB_PATH"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ts-worker/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log" && exit 0
          grep -E '^(--- )?FAIL|\.go:[0-9]+:' "$RUNNER_TEMP/go-test.log" |
            head -20 |
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          exit 1

      # The worker suite is platform sensitive: the engine reports paths with
      # the casing of the volume, and this one folds case.
      - name: Install TypeScript worker
        working-directory: ts-worker
        run: pnpm install --frozen-lockfile

      - name: Test TypeScript worker
        working-directory: ts-worker
        run: pnpm test

      # darwin/arm64 links its own pinned LadybugDB build, so the pairing of
      # the pinned core and the pinned Go binding is verified per platform: a
      # mismatched pair segfaults on the first C call instead of failing a
      # test.
      - name: Fetch the pinned LadybugDB library
        run: scripts/fetch-ladybug.sh

      - name: Go tests with LadybugDB
        run: make test-ladybug
