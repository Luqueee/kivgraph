name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

# Same reason as `ci.yml`: `setup-go` owns the toolchain, and the default
# `auto` has `go` fetch a second copy into the module cache, which then fails
# to restore on the next run.
env:
  GOTOOLCHAIN: local
  # This workflow runs the binary out of the bundle it just built, which is
  # exactly the layout that reports a first run. Today it only asks it for
  # `version` and `--help`, neither of which reports -- so this is insurance
  # against the day somebody adds a smoke `serve` here and quietly puts a
  # release runner into a number that is supposed to count installations.
  KIVGRAPH_TELEMETRY: "0"

jobs:
  verify:
    name: Verify tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }} release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # cgo links the pinned LadybugDB library, so there is no
          # cross-compilation: every target is built on its own platform.
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            native_library: lib/liblbug.so
            archive_name: kivgraph-linux-amd64.tar.gz
          - os: darwin
            arch: arm64
            runner: macos-15
            native_library: lib/liblbug.dylib
            archive_name: kivgraph-darwin-arm64.tar.gz
          # Windows carries its library beside the executable rather than in a
          # lib/ the executable points at, because there is no RUNPATH to point
          # with, and it ships a zip because that is what its tools read.
          - os: windows
            arch: amd64
            runner: windows-2022
            native_library: bin/lbug_shared.dll
            archive_name: kivgraph-windows-amd64.zip
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      BUNDLE_NAME: kivgraph-${{ matrix.os }}-${{ matrix.arch }}
      ARCHIVE_NAME: ${{ matrix.archive_name }}
      NATIVE_LIBRARY: ${{ matrix.native_library }}
      # The suffix that makes a file a program where a platform decides that
      # from the name. Empty everywhere else, so the paths below read the same.
      PROGRAM_SUFFIX: ${{ matrix.os == 'windows' && '.exe' || '' }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ts-worker/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Cache pinned LadybugDB
        uses: actions/cache@v6
        with:
          path: .tooling/ladybug
          key: ladybug-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/fetch-ladybug.sh', 'docs/dependencies/ladybugdb.md') }}

      # The Rust engine is a 40 MB download the bundle carries; the digest in
      # the manifest is what makes the cache safe to reuse.
      - name: Cache pinned rust-analyzer
        uses: actions/cache@v6
        with:
          path: .tooling/rust-analyzer
          key: rust-analyzer-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('tools/manifest.json', 'scripts/fetch-rust-analyzer.sh') }}

      # The bundle rewrites the executable's RUNPATH to the relative entry,
      # dropping the one the Go binding points at its own module directory.
      #
      # The timeout options are not cosmetic: the runner's apt mirrorlist puts
      # azure.archive.ubuntu.com first, and when it black-holes connections
      # apt pays 30 s plus backoff per index file before falling back to
      # archive.ubuntu.com. Unbounded, that alone can approach this job's
      # 30-minute budget, and a release that times out burns a version number.
      - name: Install patchelf
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update \
            -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=5 \
            -o Acquire::https::Timeout=5
          sudo apt-get install -y patchelf

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/validate-release-version.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The bundle carries the viewer. `ui` is advertised in the help of every
      # build, and a published binary that answers it with "this build carries
      # no web bundle" offers a command nobody can run: the web assets are
      # 2.3 MB of a 90 MB bundle.
      - name: Build bundle
        shell: bash
        env:
          KIVGRAPH_VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/build-bundle.sh \
            --target "$TARGET_OS/$TARGET_ARCH" \
            --version "$KIVGRAPH_VERSION" \
            "$RUNNER_TEMP/$BUNDLE_NAME"

      - name: Verify bundle provenance and checksums
        shell: bash
        env:
          KIVGRAPH_VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/verify-bundle.sh \
            --bundle "$RUNNER_TEMP/$BUNDLE_NAME" \
            --target "$TARGET_OS/$TARGET_ARCH" \
            --version "$KIVGRAPH_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-tools-manifest tools/manifest.json

      - name: Create reproducible release archive
        if: matrix.os != 'windows'
        shell: bash
        run: |
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          # The reproducibility flags below are GNU tar's; macOS runners expose
          # GNU tar as gtar and keep bsdtar under the plain tar name.
          tar_bin=$(command -v gtar || command -v tar)
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          "$tar_bin" \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --hard-dereference \
            -C "$RUNNER_TEMP" \
            -cf - "$BUNDLE_NAME" \
            | gzip -n > "$assets/$ARCHIVE_NAME"
          (
            cd "$assets"
            sha256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          )
          test "$(awk '{print $2}' "$assets/$ARCHIVE_NAME.sha256")" = "$ARCHIVE_NAME"
          test -s "$assets/$ARCHIVE_NAME"
          test -s "$assets/$ARCHIVE_NAME.sha256"

      # Windows ships a zip, and a zip is not reproducible the way the tarball
      # above is: it stores a modification time per entry and offers no flag to
      # normalise them. They are normalised before packing instead, to
      # 1980-01-01 -- the earliest date the format can represent -- and the
      # entry order is fixed by handing the packer a sorted list rather than
      # letting it walk the tree.
      #
      # Measured on a Windows host, two passes over one bundle produce a
      # byte-identical zip. What that does not establish is the same across two
      # runners, because the compressor is not pinned and this has only been
      # run on one machine. The property the release actually checks is the
      # bundle's, and check-reproducible-bundle.sh verifies that before this
      # step runs; the archive is a container around an artifact already shown
      # to be reproducible.
      #
      # The packer is bsdtar and named explicitly. A Git for Windows shell puts
      # GNU tar first on PATH, and GNU tar cannot write a zip at all -- it does
      # not fail over to something that can, it fails.
      - name: Create release archive
        if: matrix.os == 'windows'
        shell: bash
        run: |
          bsdtar=""
          for candidate in /c/Windows/System32/tar.exe tar; do
            if "$candidate" --version 2>/dev/null | grep -qi bsdtar; then
              bsdtar="$candidate"
              break
            fi
          done
          [[ -n "$bsdtar" ]] || { echo "no bsdtar found: a zip cannot be written with GNU tar" >&2; exit 1; }
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          cd "$RUNNER_TEMP"
          find "$BUNDLE_NAME" -exec touch -t 198001010000 {} +
          find "$BUNDLE_NAME" -print | LC_ALL=C sort > entries.txt
          "$bsdtar" --format=zip -cf "$assets/$ARCHIVE_NAME" -T entries.txt
          # The line is built rather than taken from the tool's output, which
          # is what build-bundle.sh does and for the reason this step found:
          # sha256sum defaults to binary mode in a Git for Windows shell and
          # marks the name with an asterisk, so the file name in the manifest
          # is "*kivgraph-windows-amd64.zip" and matches nothing.
          (
            cd "$assets"
            printf '%s  %s\n' "$(sha256sum "$ARCHIVE_NAME" | awk '{print $1}')" "$ARCHIVE_NAME" \
              > "$ARCHIVE_NAME.sha256"
          )
          test "$(awk '{print $2}' "$assets/$ARCHIVE_NAME.sha256")" = "$ARCHIVE_NAME"
          test -s "$assets/$ARCHIVE_NAME"
          # The installer refuses a backslash, and the packer that produces one
          # is the mistake this catches: it is checked here, where the archive
          # is made, rather than left for a user to discover at install time.
          #
          # The separator is built with printf rather than spelled as a literal.
          # A backslash inside single quotes reaches grep untouched, and grep
          # then reads it as a BRE escape -- so the spelling this line used to
          # carry searched for *two* consecutive backslashes and could never
          # match the one-backslash path a bad packer writes. It was a check
          # that could not fail. -F and a built separator remove the second
          # layer of quoting entirely.
          backslash="$(printf '\134')"
          ! unzip -l "$assets/$ARCHIVE_NAME" | grep -qF "$backslash"
      # The MCP Registry accepts npm, PyPI, NuGet, cargo, OCI and MCPB packages,
      # and a `.tar.gz` on a release is none of them. MCPB is the one that
      # describes what this release already is -- a prebuilt binary needing no
      # toolchain -- so the same bundle is published twice, in two containers,
      # rather than distributed a second way.
      - name: Create MCP bundle
        shell: bash
        env:
          KIVGRAPH_VERSION: ${{ steps.release.outputs.version }}
        run: |
          assets="$RUNNER_TEMP/release-assets"
          scripts/build-mcpb.sh \
            --bundle "$RUNNER_TEMP/$BUNDLE_NAME" \
            --version "$KIVGRAPH_VERSION" \
            --target "$TARGET_OS/$TARGET_ARCH" \
            --output "$assets/$BUNDLE_NAME.mcpb" \
            > "$assets/$BUNDLE_NAME.mcpb.sha256.raw"
          # The script prints "<digest>  <name>", which is already the format
          # `sha256sum -c` reads.
          mv "$assets/$BUNDLE_NAME.mcpb.sha256.raw" "$assets/$BUNDLE_NAME.mcpb.sha256"
          test -s "$assets/$BUNDLE_NAME.mcpb"
          test -s "$assets/$BUNDLE_NAME.mcpb.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs:
      - verify
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact tag for release metadata
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download platform release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: ${{ runner.temp }}/platform-assets
          merge-multiple: true

      - name: Assemble release assets
        shell: bash
        run: |
          platform_assets="$RUNNER_TEMP/platform-assets"
          assets="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$assets"
          cp "$platform_assets"/*.tar.gz "$assets/"
          cp "$platform_assets"/*.zip "$assets/"
          cp "$platform_assets"/*.mcpb "$assets/"
          install -m 0755 scripts/install.sh "$assets/install.sh"
          # 0644, not 0755: a PowerShell script is not run by its mode bit, and
          # marking it executable would only claim something about it that is
          # not true on the platform that reads it.
          install -m 0644 scripts/install.ps1 "$assets/install.ps1"
          install -m 0755 scripts/uninstall.sh "$assets/uninstall.sh"
          install -m 0644 scripts/uninstall.ps1 "$assets/uninstall.ps1"
          cat "$platform_assets"/*.tar.gz.sha256 "$platform_assets"/*.zip.sha256 \
            "$platform_assets"/*.mcpb.sha256 \
            > "$RUNNER_TEMP/platform-checksums"
          (
            cd "$assets"
            # Each archive must still hash to what its own build job recorded.
            sha256sum -c "$RUNNER_TEMP/platform-checksums"
            # SHA256SUMS covers every published file, lexicographic, no paths.
            sha256sum -- install.sh install.ps1 uninstall.sh uninstall.ps1 \
              *.tar.gz *.zip *.mcpb \
              | LC_ALL=C sort -k 2 > SHA256SUMS
            published=$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)
            test "$(wc -l < SHA256SUMS)" -eq "$published"
          )
          test -s "$assets/SHA256SUMS"
          test -s "$assets/install.sh"
          test -s "$assets/install.ps1"
          test -s "$assets/uninstall.sh"
          test -s "$assets/uninstall.ps1"

      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.mcpb

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes_file="landing/src/content/releases/${TAG}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Release notes for $TAG not found at $notes_file." >&2
            exit 1
          fi

          # Extract body by dropping the frontmatter (between the first two '---')
          awk '/^---$/{p++; next} p>=2{print}' "$notes_file" | sed '/./,$!d' > "$RUNNER_TEMP/release-notes.md"

          assets=(
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.mcpb
            "release-assets/SHA256SUMS"
            "release-assets/install.sh"
            "release-assets/install.ps1"
            "release-assets/uninstall.sh"
            "release-assets/uninstall.ps1"
          )
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            release_args=(
              --verify-tag
              --title "Kivgraph $TAG"
              --notes-file "$RUNNER_TEMP/release-notes.md"
            )
            if [[ "$TAG" == *-* ]]; then
              release_args+=(--prerelease)
            else
              release_args+=(--latest)
            fi
            gh release create "$TAG" "${release_args[@]}"
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber

  post-publish-smoke:
    name: Smoke published ${{ matrix.os }}/${{ matrix.arch }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            archive_name: kivgraph-linux-amd64.tar.gz
          - os: darwin
            arch: arm64
            runner: macos-15
            archive_name: kivgraph-darwin-arm64.tar.gz
          - os: windows
            arch: amd64
            runner: windows-2022
            archive_name: kivgraph-windows-amd64.zip
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      BUNDLE_NAME: kivgraph-${{ matrix.os }}-${{ matrix.arch }}
      ARCHIVE_NAME: ${{ matrix.archive_name }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download published archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE_NAME" \
            --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/published" \
            --clobber

      - name: Verify published archive digest
        shell: bash
        # Hashed by bare name from inside the download directory, never by a
        # path built from $RUNNER_TEMP: on windows-2022 that variable is
        # backslash-separated, and GNU sha256sum's response to a backslash in
        # the name it is given is to prefix the whole line with one and
        # double the ones in the name -- `\<hash> *D:\\a\\_temp/...`. A plain
        # `awk '{print $1}'` then reads that leading backslash into the
        # digest and no real mismatch is required to fail the comparison.
        run: |
          cd "$RUNNER_TEMP/published"
          test -s "$ARCHIVE_NAME"
          test -s SHA256SUMS
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$ARCHIVE_NAME" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$ARCHIVE_NAME" | awk '{print $1}')
          fi
          expected=$(awk -v name="$ARCHIVE_NAME" '$2 == name {print $1}' SHA256SUMS)
          test -n "$expected"
          test "$actual" = "$expected"

      - name: Extract published archive
        shell: bash
        run: |
          archive="$RUNNER_TEMP/published/$ARCHIVE_NAME"
          extract_root="$(mktemp -d "$RUNNER_TEMP/kivgraph-smoke.XXXXXX")"
          case "$TARGET_OS" in
            # The published ZIP contains duplicate entries for some paths,
            # including SHA256SUMS. `-o` makes that duplicate extraction
            # non-interactive; the unique root also prevents leftovers from a
            # previous job on a reused Windows runner from prompting.
            windows) unzip -oq "$archive" -d "$extract_root" ;;
            *) tar -xzf "$archive" -C "$extract_root" ;;
          esac
          test -d "$extract_root/$BUNDLE_NAME"
          echo "KIVGRAPH_SMOKE_BUNDLE=$extract_root/$BUNDLE_NAME" >> "$GITHUB_ENV"

      # This is deliberately run against the archive fetched from the release,
      # not the build workspace or an intermediate Actions artifact. It proves
      # the upload, the archive container and the installer payload agree.
      - name: Verify and smoke the published bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/verify-bundle.sh \
            --bundle "$KIVGRAPH_SMOKE_BUNDLE" \
            --target "$TARGET_OS/$TARGET_ARCH" \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --source-tools-manifest tools/manifest.json

  # Publishing to the MCP Registry is its own job, after the release exists,
  # because the registry fetches the package URL to check the `fileSha256` it
  # was given. Running it beside `publish` would race the upload and fail on a
  # 404 that describes nothing.
  #
  # `github-oidc` is what removes the interactive step: `mcp-publisher login
  # github` opens a device flow, which no unattended run can complete, and the
  # alternative is a long-lived token in the repository secrets. The identity
  # proven here is the repository itself, which is also the namespace being
  # published to -- `io.github.Luqueee/kivgraph`.
  registry:
    name: Publish to the MCP Registry
    needs: post-publish-smoke
    # Development releases are GitHub prereleases for opt-in testing. The
    # public MCP Registry is the stable distribution channel and must not make
    # a prerelease discoverable to clients that did not opt into it.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download platform release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: ${{ runner.temp }}/platform-assets
          merge-multiple: true

      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      # The digests are read from the artifacts this run produced, not from the
      # release page: a hash taken from what was uploaded describes what was
      # uploaded, and one taken from anywhere else is a claim about it.
      - name: Build the published server.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          platform_assets="$RUNNER_TEMP/platform-assets"
          version="${TAG#v}"
          args=()
          for target in linux/amd64 darwin/arm64 windows/amd64; do
            asset="kivgraph-${target%%/*}-${target##*/}.mcpb"
            test -s "$platform_assets/$asset"
            digest="$(sha256sum "$platform_assets/$asset" | awk '{print $1}')"
            # It must still hash to what its own build job recorded.
            grep -q "$digest" "$platform_assets/$asset.sha256"
            args+=(--package "$target=$digest")
          done
          scripts/build-server-json.sh \
            --version "$version" \
            --tag "$TAG" \
            "${args[@]}" \
            --output server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate with the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
